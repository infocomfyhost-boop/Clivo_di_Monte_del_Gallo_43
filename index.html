<body>

  <script>
    const SERVER_URI = "https://shelly-234-eu.shelly.cloud";
    const AUTH_KEY   = "M2MyYzlkdWlk31BD5EF51539AF8EE7F0F0EB878D2D73D8A9BA8A66B6404842BF1A3A7B2155DD4B7F57BAD462D6B9";
    const DEVICE_ID  = "b0a7324b7278";

    fetch(`${SERVER_URI}/device/relay/control`, {
